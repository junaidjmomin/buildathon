services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sl3dge
      POSTGRES_USER: sl3dge
      POSTGRES_PASSWORD: sl3dge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
